<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/src/assets/bull-ledger-icon.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BullLedger</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var theme = localStorage.getItem("bullledger-theme");
          var dark =
            theme === "dark" ||
            theme === null ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();

      // And the motion preference, for the same reason: someone who asked for
      // no animation should not be shown one while the bundle parses. The key
      // and the attribute belong to src/store/motionPreference.ts, which owns
      // every change after this frame; the shape is what zustand's `persist`
      // writes.
      (function () {
        try {
          var stored = localStorage.getItem("bullledger-motion");
          if (stored && JSON.parse(stored).state.reduceMotion) {
            document.documentElement.setAttribute("data-reduce-motion", "");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
