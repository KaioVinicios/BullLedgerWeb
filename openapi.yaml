      - compounding
      - country
      - currency
      - deposit_insurance
      - id
      - liquidity
      - name
      - pricing_mode
      - rate_index
      - rate_type
    CashDepositAssetRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        archetype:
          $ref: '#/components/schemas/ArchetypeEnum'
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        country:
          $ref: '#/components/schemas/CountryEnum'
        rate_type:
          $ref: '#/components/schemas/RateTypeEnum'
        rate_index:
          $ref: '#/components/schemas/RateIndexEnum'
        compounding:
          $ref: '#/components/schemas/CompoundingEnum'
        deposit_insurance:
          $ref: '#/components/schemas/DepositInsuranceEnum'
        liquidity:
          $ref: '#/components/schemas/LiquidityEnum'
        rate_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,8})?$
          nullable: true
          description: Decimal string fraction — 0.1375 means 13.75%. Never parse
            as a float.
      required:
      - archetype
      - compounding
      - country
      - currency
      - deposit_insurance
      - liquidity
      - name
      - rate_index
      - rate_type
