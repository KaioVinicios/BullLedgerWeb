        * `DAILY` - Daily
        * `MONTHLY` - Monthly
    ContributionLimit:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        registration:
          allOf:
          - $ref: '#/components/schemas/RegistrationEnum'
          readOnly: true
        year:
          type: integer
          readOnly: true
        limit:
          allOf:
          - $ref: '#/components/schemas/Money'
          readOnly: true
