components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        institution:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 100
        country:
          $ref: '#/components/schemas/CountryEnum'
        registration:
          $ref: '#/components/schemas/RegistrationEnum'
        base_currency:
          $ref: '#/components/schemas/CurrencyEnum'
        account_number:
          type: string
          maxLength: 50
        contribution_room:
          allOf:
          - $ref: '#/components/schemas/Money'
          nullable: true
        plan_type:
          allOf:
          - $ref: '#/components/schemas/PlanTypeEnum'
          nullable: true
        deductible:
          type: boolean
          nullable: true
        tax_regime:
          allOf:
          - $ref: '#/components/schemas/TaxRegimeEnum'
          nullable: true
        taxed_on:
          allOf:
          - $ref: '#/components/schemas/TaxedOnEnum'
          nullable: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - archived_at
      - base_currency
      - country
      - id
      - name
      - registration
    AccountArchetypeTarget:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        scope:
          $ref: '#/components/schemas/TargetScopeEnum'
        account:
          type: string
          format: uuid
        archetype:
          $ref: '#/components/schemas/ArchetypeEnum'
        loss_limit_pct:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,8})?$
          nullable: true
          description: Decimal string fraction — 0.1375 means 13.75%. Never parse
            as a float.
        loss_limit_period:
          allOf:
          - $ref: '#/components/schemas/PeriodEnum'
          nullable: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/TargetStep'
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - account
      - archetype
      - archived_at
      - id
      - scope
      - steps
    AccountArchetypeTargetRequest:
      type: object
      properties:
        scope:
          $ref: '#/components/schemas/TargetScopeEnum'
        account:
          type: string
          format: uuid
        archetype:
          $ref: '#/components/schemas/ArchetypeEnum'
        loss_limit_pct:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,8})?$
          nullable: true
          description: Decimal string fraction — 0.1375 means 13.75%. Never parse
            as a float.
        loss_limit_period:
          allOf:
          - $ref: '#/components/schemas/PeriodEnum'
          nullable: true
        steps:
          type: array
          items:
            $ref: '#/components/schemas/TargetStepRequest'
      required:
      - account
      - archetype
      - scope
      - steps
    AccountArchiveEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Account'
        status:
          type: integer
          default: 200
        message:
          type: string
      required:
      - data
    AccountCreateEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Account'
        status:
          type: integer
          default: 200
        message:
          type: string
      required:
      - data
    AccountGetEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Account'
        status:
          type: integer
          default: 200
        message:
          type: string
      required:
      - data
    AccountGroup:
      type: object
      description: 'One account''s slice of the overview: free cash + holding rows.'
      properties:
        account:
          type: string
          format: uuid
        cash:
          allOf:
          - $ref: '#/components/schemas/Money'
          nullable: true
        subtotal:
          $ref: '#/components/schemas/Money'
        complete:
          type: boolean
        holdings:
          type: array
          items:
            $ref: '#/components/schemas/HoldingSummary'
      required:
      - account
      - cash
      - complete
      - holdings
      - subtotal
    AccountPatchEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Account'
        status:
          type: integer
          default: 200
        message:
          type: string
      required:
      - data
    AccountRequest:
      type: object
      properties:
        institution:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          minLength: 1
          maxLength: 100
        country:
          $ref: '#/components/schemas/CountryEnum'
        registration:
          $ref: '#/components/schemas/RegistrationEnum'
        base_currency:
          $ref: '#/components/schemas/CurrencyEnum'
        account_number:
          type: string
          maxLength: 50
        contribution_room:
          allOf:
          - $ref: '#/components/schemas/MoneyRequest'
          nullable: true
        plan_type:
          allOf:
          - $ref: '#/components/schemas/PlanTypeEnum'
          nullable: true
        deductible:
          type: boolean
          nullable: true
        tax_regime:
          allOf:
          - $ref: '#/components/schemas/TaxRegimeEnum'
          nullable: true
        taxed_on:
          allOf:
          - $ref: '#/components/schemas/TaxedOnEnum'
          nullable: true
      required:
      - base_currency
      - country
      - name
      - registration
    AccountUnarchiveEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Account'
        status:
          type: integer
          default: 200
        message:
          type: string
      required:
      - data
    AllocationSlice:
      type: object
      description: One value/weight slice of an allocation dimension (FR-VIEW-004).
      properties:
        key:
          type: string
        value:
          $ref: '#/components/schemas/Money'
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,8})?$
          nullable: true
          description: Decimal string fraction — 0.1375 means 13.75%. Never parse
            as a float.
        complete:
          type: boolean
      required:
      - complete
      - key
      - value
      - weight
    ApiError:
      type: object
      description: The wire shape of every raised 4xx/5xx body (M9 decision 2).
      properties:
        status:
          type: integer
          description: Mirrors the HTTP status code.
        message:
          type: string
          description: Human-readable summary. Never carries figures or credentials.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Field name to messages. Nested fields use dotted keys; problems
            with no field use "detail".
        codes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Same shape and keys as `errors`, but the stable machine-readable
            code behind each message — translate by this, never by matching the English
            text in `errors`, which a library upgrade can reword without notice. A
            message raised without a specific code falls back to "invalid".
      required:
      - codes
      - errors
      - message
      - status
    ArchetypeEnum:
      enum:
      - CASH_DEPOSIT
      - FIXED_INCOME
      - EXCHANGE_SECURITY
      - NAV_FUND
      - CRYPTO
      type: string
      description: |-
        * `CASH_DEPOSIT` - Cash deposit
        * `FIXED_INCOME` - Fixed income
        * `EXCHANGE_SECURITY` - Exchange-traded security
        * `NAV_FUND` - NAV-priced fund
        * `CRYPTO` - Crypto
    ArchetypeSlice:
      type: object
      description: Per-archetype total (holdings only; free cash is its own bucket).
      properties:
        archetype:
          $ref: '#/components/schemas/ArchetypeEnum'
        value:
          $ref: '#/components/schemas/Money'
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,8})?$
          nullable: true
          description: Decimal string fraction — 0.1375 means 13.75%. Never parse
            as a float.
        complete:
          type: boolean
      required:
      - archetype
      - complete
      - value
      - weight
    Asset:
      oneOf:
      - $ref: '#/components/schemas/CashDepositAsset'
      - $ref: '#/components/schemas/FixedIncomeAsset'
      - $ref: '#/components/schemas/ExchangeSecurityAsset'
      - $ref: '#/components/schemas/NavFundAsset'
      - $ref: '#/components/schemas/CryptoAsset'
      discriminator:
        propertyName: archetype
        mapping:
          CASH_DEPOSIT: '#/components/schemas/CashDepositAsset'
          FIXED_INCOME: '#/components/schemas/FixedIncomeAsset'
          EXCHANGE_SECURITY: '#/components/schemas/ExchangeSecurityAsset'
          NAV_FUND: '#/components/schemas/NavFundAsset'
          CRYPTO: '#/components/schemas/CryptoAsset'
    AssetArchiveEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Asset'
        status:
          type: integer
          default: 200
        message:
          type: string
      required:
      - data
    AssetCreateEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Asset'
        status:
          type: integer
          default: 200
        message:
          type: string
      required:
      - data
    AssetGetEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Asset'
        status:
          type: integer
          default: 200
        message:
          type: string
      required:
      - data
    AssetPatchEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Asset'
        status:
          type: integer
          default: 200
        message:
          type: string
      required:
      - data
    AssetRequest:
      oneOf:
      - $ref: '#/components/schemas/CashDepositAssetRequest'
      - $ref: '#/components/schemas/FixedIncomeAssetRequest'
      - $ref: '#/components/schemas/ExchangeSecurityAssetRequest'
      - $ref: '#/components/schemas/NavFundAssetRequest'
      - $ref: '#/components/schemas/CryptoAssetRequest'
      discriminator:
        propertyName: archetype
        mapping:
          CASH_DEPOSIT: '#/components/schemas/CashDepositAssetRequest'
          FIXED_INCOME: '#/components/schemas/FixedIncomeAssetRequest'
          EXCHANGE_SECURITY: '#/components/schemas/ExchangeSecurityAssetRequest'
          NAV_FUND: '#/components/schemas/NavFundAssetRequest'
          CRYPTO: '#/components/schemas/CryptoAssetRequest'
    AssetUnarchiveEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Asset'
        status:
          type: integer
          default: 200
        message:
          type: string
      required:
      - data
    CashDepositAsset:
