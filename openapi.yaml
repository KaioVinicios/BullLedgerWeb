          type: string
          format: uuid
        description: A UUID string identifying this contribution limit.
        required: true
      tags:
      - Reference
      security:
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributionLimitGetEnvelope'
          description: The requested contribution limit.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No contribution limit with that id.
        '401':
          description: No valid session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/fx-rates/:
    get:
      operationId: api_fx_rates_list
      description: 'Global market facts: everyone reads, only staff writes (M7 decision
        2).'
      summary: List FX rates
      parameters:
      - in: query
        name: base
        schema:
          type: string
          enum:
          - BRL
          - CAD
          - USD
        description: Filter by base currency.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: quote
        schema:
          type: string
          enum:
          - BRL
          - CAD
          - USD
        description: Filter by quote currency.
      tags:
      - Pricing
      security:
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFxRateList'
          description: A page of FX rates, newest first.
        '401':
          description: No valid session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: api_fx_rates_create
      description: The FX table is global; manual corrections are admin-only.
      summary: Enter a manual FX rate (staff only)
      tags:
      - Pricing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FxRateRequest'
        required: true
      security:
      - jwtCookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxRateCreateEnvelope'
          description: The created FX rate.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failed — `errors` names the offending fields.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Authenticated, but not permitted to perform this action.
        '401':
          description: No valid session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/fx-rates/{id}/:
    get:
      operationId: api_fx_rates_retrieve
      description: 'Global market facts: everyone reads, only staff writes (M7 decision
        2).'
      summary: Get one FX rate
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this fx rate.
        required: true
      tags:
      - Pricing
      security:
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FxRateGetEnvelope'
          description: The requested FX rate.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such object in your portfolio.
        '401':
          description: No valid session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/institutions/:
    get:
      operationId: api_institutions_list
      description: Banks, brokerages, exchanges, and self-custody wallets (FR-INST).
