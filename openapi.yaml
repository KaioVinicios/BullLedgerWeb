      - id
      - limit
      - registration
      - year
    ContributionLimitGetEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ContributionLimit'
        status:
          type: integer
          default: 200
        message:
          type: string
      required:
      - data
    CookieJWT:
      type: object
      description: |-
        Login/registration response body: user payload only.

        dj-rest-auth's JWTSerializer returns the access (and on registration the
        refresh) token in the response body even with JWT_AUTH_HTTPONLY=True.
        Tokens must travel in httpOnly cookies only (NFR-SEC-001), so the token
        fields are dropped from the body.
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/EmailUserDetails'
          readOnly: true
      required:
      - user
    CountryEnum:
