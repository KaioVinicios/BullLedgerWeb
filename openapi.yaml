          maxLength: 255
        archetype:
          $ref: '#/components/schemas/ArchetypeEnum'
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        country:
          $ref: '#/components/schemas/CountryEnum'
        symbol:
          type: string
          minLength: 1
          maxLength: 10
        decimals:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        price_currency:
