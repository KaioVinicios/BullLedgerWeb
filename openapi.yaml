- name: Assets
  description: Instruments, typed by archetype.
- name: Movements
  description: The ledger — the only source of truth.
- name: Lots
  description: Per-contribution organization of a holding.
- name: Pricing
  description: Price quotes and FX rates.
- name: Reference
  description: Contribution limits and reference data.
- name: Portfolio
  description: Derived reporting views.
- name: Targets
  description: Performance expectations and their derived status.
