openapi: 3.0.3
info:
  title: BullLedger API
  version: 1.0.0
  description: Multi-country investment portfolio ledger — movements-first API.
paths:
  /api/accounts/:
    get:
      operationId: api_accounts_list
      description: Accounts and their country-scoped tax wrappers (FR-ACCT).
      summary: List my accounts
      parameters:
      - in: query
        name: include_archived
        schema:
          type: boolean
        description: Pass `true` to also return archived rows (hidden by default).
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Accounts
      security:
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountList'
          description: A page of your accounts.
        '401':
          description: No valid session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: api_accounts_create
      description: Accounts and their country-scoped tax wrappers (FR-ACCT).
      summary: Create an account
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
        required: true
      security:
      - jwtCookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreateEnvelope'
          description: The created account.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failed — `errors` names the offending fields.
        '401':
          description: No valid session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/accounts/{id}/:
    get:
      operationId: api_accounts_retrieve
      description: Accounts and their country-scoped tax wrappers (FR-ACCT).
      summary: Get one account
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this account.
        required: true
      tags:
      - Accounts
      security:
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGetEnvelope'
          description: The requested account.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such object in your portfolio.
        '401':
          description: No valid session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      operationId: api_accounts_partial_update
      description: Accounts and their country-scoped tax wrappers (FR-ACCT).
      summary: Update an account
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this account.
        required: true
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountRequest'
      security:
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPatchEnvelope'
          description: The updated account.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failed — `errors` names the offending fields.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such object in your portfolio.
        '401':
          description: No valid session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/accounts/{id}/archive/:
    post:
      operationId: api_accounts_archive_create
      description: Accounts and their country-scoped tax wrappers (FR-ACCT).
      summary: Archive an account
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this account.
        required: true
      tags:
      - Accounts
      security:
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountArchiveEnvelope'
          description: The archived account.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such object in your portfolio.
        '401':
          description: No valid session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/accounts/{id}/unarchive/:
    post:
      operationId: api_accounts_unarchive_create
      description: Accounts and their country-scoped tax wrappers (FR-ACCT).
      summary: Unarchive an account
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this account.
        required: true
      tags:
      - Accounts
      security:
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUnarchiveEnvelope'
          description: The restored account.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such object in your portfolio.
        '401':
          description: No valid session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/assets/:
    get:
      operationId: api_assets_list
      description: Instruments, typed by archetype (FR-ASSET). Archive instead of
        delete.
      summary: List my assets
      parameters:
      - in: query
        name: include_archived
        schema:
          type: boolean
        description: Pass `true` to also return archived rows (hidden by default).
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Assets
      security:
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssetList'
          description: A page of your assets.
        '401':
          description: No valid session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: api_assets_create
      description: Instruments, typed by archetype (FR-ASSET). Archive instead of
        delete.
      summary: Create an asset
      tags:
      - Assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetRequest'
      security:
      - jwtCookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCreateEnvelope'
          description: The created asset.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failed — `errors` names the offending fields.
        '401':
          description: No valid session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/assets/{id}/:
    get:
      operationId: api_assets_retrieve
      description: Instruments, typed by archetype (FR-ASSET). Archive instead of
        delete.
      summary: Get one asset
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this asset.
        required: true
      tags:
      - Assets
      security:
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetGetEnvelope'
          description: The requested asset.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such object in your portfolio.
        '401':
          description: No valid session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      operationId: api_assets_partial_update
      description: Instruments, typed by archetype (FR-ASSET). Archive instead of
        delete.
      summary: Update an asset
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this asset.
        required: true
      tags:
      - Assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssetUpdateRequest'
      security:
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPatchEnvelope'
          description: The updated asset.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Validation failed — `errors` names the offending fields.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such object in your portfolio.
        '401':
          description: No valid session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/assets/{id}/archive/:
    post:
      operationId: api_assets_archive_create
      description: Instruments, typed by archetype (FR-ASSET). Archive instead of
        delete.
      summary: Archive an asset
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this asset.
        required: true
      tags:
      - Assets
      security:
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetArchiveEnvelope'
          description: The archived asset.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such object in your portfolio.
        '401':
          description: No valid session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/assets/{id}/unarchive/:
    post:
      operationId: api_assets_unarchive_create
      description: Instruments, typed by archetype (FR-ASSET). Archive instead of
        delete.
      summary: Unarchive an asset
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this asset.
        required: true
      tags:
      - Assets
      security:
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetUnarchiveEnvelope'
          description: The restored asset.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: No such object in your portfolio.
        '401':
          description: No valid session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/auth/csrf/:
    get:
      operationId: api_auth_csrf_retrieve
      description: Sets the `csrftoken` cookie and returns no body. Call it once before
        the first unsafe request; every `POST`, `PUT`, `PATCH`, and `DELETE` must
        then echo that cookie's value in the `X-CSRFToken` header. Safe methods need
        nothing.
      summary: Issue a CSRF cookie
      tags:
      - Auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/google/:
    post:
      operationId: api_auth_google_create
      description: |-
        Google authorization-code exchange (FR-AUTH-002, design §6).

        The SPA posts the code; allauth exchanges it server-side (the client
        secret never leaves the backend) and the LoginView machinery sets the
        same httpOnly JWT cookies as email login.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
      security:
      - jwtCookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialLogin'
          description: ''
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      description: |-
        Check the credentials and return the REST Token
        if the credentials are valid and authenticated.
        Calls Django Auth login method to register User ID
        in Django session framework

        Accept the following POST parameters: username, password
        Return the REST Framework Token Object's key.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailLoginRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CookieJWT'
          description: ''
  /api/auth/logout/:
    post:
      operationId: api_auth_logout_create
      description: |-
        Calls Django logout method and delete the Token object
        assigned to the current User object.

        Accepts/Returns nothing.
      tags:
      - Auth
      security:
      - jwtCookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/auth/password/reset/:
    post:
      operationId: api_auth_password_reset_create
      description: |-
        Calls Django Auth PasswordResetForm save method.

        Accepts the following POST parameters: email
        Returns the success/fail message.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SPAPasswordResetRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/auth/password/reset/confirm/:
    post:
      operationId: api_auth_password_reset_confirm_create
      description: |-
        Password reset e-mail link is confirmed, therefore
        this resets the user's password.

        Accepts the following POST parameters: token, uid,
            new_password1, new_password2
        Returns the success/fail message.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SPAPasswordResetConfirmRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/auth/registration/:
    post:
      operationId: api_auth_registration_create
      description: |-
        Registration that also sets the JWT cookies (design §4).

        dj-rest-auth's RegisterView generates the token pair but only puts it in
        the response body — it never sets the cookies, so a fresh registration
        wouldn't be logged in. The body itself stays token-free via
        CookieJWTSerializer.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRegisterRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailRegister'
          description: ''
  /api/auth/registration/resend-email/:
    post:
      operationId: api_auth_registration_resend_email_create
      description: |-
        Resends another email to an unverified email.

        Accepts the following POST parameter: email.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendEmailVerificationRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/auth/registration/verify-email/:
    post:
      operationId: api_auth_registration_verify_email_create
      description: |-
        Verifies the email associated with the provided key.

        Accepts the following POST parameter: key.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: api_auth_token_refresh_create
      description: |-
        Token refresh with cookie-only output.

        dj-rest-auth's refresh view strips the rotated refresh token from the
        body but still returns the new access token there. Both belong in
        httpOnly cookies only (NFR-SEC-001), so the access token and its
        expiration are removed after the parent sets the cookies.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/user/:
    get:
      operationId: api_auth_user_retrieve
      description: |-
        Reads and updates UserModel fields
        Accepts GET, PUT, PATCH methods.

        Default accepted fields: username, first_name, last_name
        Default display fields: pk, username, email, first_name, last_name
        Read-only fields: pk, email

        Returns UserModel fields.
      tags:
      - Auth
      security:
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailUserDetails'
          description: ''
        '401':
          description: No valid session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      operationId: api_auth_user_update
      description: |-
        Reads and updates UserModel fields
        Accepts GET, PUT, PATCH methods.

        Default accepted fields: username, first_name, last_name
        Default display fields: pk, username, email, first_name, last_name
        Read-only fields: pk, email

        Returns UserModel fields.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailUserDetailsRequest'
      security:
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailUserDetails'
          description: ''
        '401':
          description: No valid session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      operationId: api_auth_user_partial_update
      description: |-
        Reads and updates UserModel fields
        Accepts GET, PUT, PATCH methods.

        Default accepted fields: username, first_name, last_name
        Default display fields: pk, username, email, first_name, last_name
        Read-only fields: pk, email

        Returns UserModel fields.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEmailUserDetailsRequest'
      security:
      - jwtCookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailUserDetails'
          description: ''
        '401':
          description: No valid session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/contribution-limits/:
    get:
      operationId: api_contribution_limits_list
      description: Fixture/admin-maintained reference data — read-only via API.
      summary: List contribution limits
      parameters:
      - name: page
